name: Test and package addon
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run Lua 5.1 tests
        run: python3 DuckMooPlanner/tests/run_tests.py
      - name: Package addon
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: DuckMooPlanner-installable
          path: dist/*.zip
          if-no-files-found: error
